x-app-common: &app-common
  build: .
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - backend_node_modules:/workspace/packages/backend/node_modules
    - frontend_node_modules:/workspace/packages/frontend/node_modules

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      [
        "start-dev",
        "--import-realm",
        "--hostname",
        "localhost",
        "--spi-theme-static-max-age=-1",
        "--spi-theme-cache-themes=false",
        "--spi-theme-cache-templates=false",
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/task-app-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

  openapi:
    image: swaggerapi/swagger-ui:v5.32.0
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./openapi/openapi.yaml:/app/openapi.yaml:ro
      - ./docker/openapi.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started

  dev-init:
    <<: *app-common
    command: ["bun", "install"]

  backend:
    <<: *app-common
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydb?schema=public
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/task-app
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/task-app/protocol/openid-connect/certs
      - KEYCLOAK_AUDIENCE=task-api
    command: ["sh", "-c", "NODE_ENV=development bun run --filter backend dev"]
    depends_on:
      dev-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    <<: *app-common
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    command: ["sh", "-c", "NODE_ENV=development bun run --filter frontend dev"]
    depends_on:
      dev-init:
        condition: service_completed_successfully

volumes:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
