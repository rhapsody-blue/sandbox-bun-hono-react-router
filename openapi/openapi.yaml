openapi: 3.1.0
info:
  title: Task API
  version: 1.0.0
servers:
  - url: /api
security:
  - BearerAuth: []
tags:
  - name: tasks
    description: Task operations
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Get API health status
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /tasks:
    get:
      operationId: listTasks
      tags:
        - tasks
      summary: Get all tasks
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createTask
      tags:
        - tasks
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Request validation failed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Task identifier
        schema:
          type: string
    get:
      operationId: getTask
      tags:
        - tasks
      summary: Get task by ID
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateTask
      tags:
        - tasks
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Request validation failed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteTask
      tags:
        - tasks
      summary: Delete a task
      responses:
        "204":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Task:
      type: object
      required:
        - id
        - title
        - description
        - status
        - priority
        - dueDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        status:
          type: string
        priority:
          type: string
        dueDate:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
    UpdateTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - "null"
        status:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access denied by authorization policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Task not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdentityProviderUnavailable:
      description: Identity provider is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
